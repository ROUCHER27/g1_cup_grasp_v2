# Standalone navigate_station.py remains disabled. The complete transport entry requires both real-motion CLI flags.
enable_real_navigation: false
# HAL 7.2.0.23 实测（outputs/navigation_contract/g1_nav_api_report.md §1.1）：等级 1→0.8×、2→1.0×（全尺寸避障区域）、3→0.8×；与 srv 注释"越高越灵敏"相反。
agv_collision_level: 2
navigation:
  no_progress_timeout_s: 10.0
  timeout_base_s: 60.0
  timeout_per_metre_s: 60.0
  timeout_max_s: 300.0
  avoid_timeout_s: 30.0
  avoid_total_timeout_s: 60.0
  avoid_grace_s: 5.0
  avoid_max_episodes: 5
  avoid_max_departure_m: 1.0
  # 所有 Avoid episode 的最大距离增量之和上限（max_distance_m - start_distance_m），单位 m。
  avoid_total_departure_m: 2.0
  treat_halted_walking_as_avoid: false
  detour:
    enabled: false
    lateral_offsets_m: [0.5, 0.7]
    ahead_m: 0.6
    robot_radius_m: 0.35
    via_tolerance_m: 0.15
    occupied_threshold: 50
# 可选底盘速度参数。速度单位 m/s、rad/s；min_collision_distance 在 HAL 中未接到避障多边形，无效；默认不写。
# chassis_info:
#   max_linear_speed: 0.4
#   max_angular_speed: 0.5
#   min_collision_distance: 0.15
